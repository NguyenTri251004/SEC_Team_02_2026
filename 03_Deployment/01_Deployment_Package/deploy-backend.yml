name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - "02_Source/01_Source Code/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Type Check & Deploy to Fly.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "02_Source/01_Source Code/backend"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "02_Source/01_Source Code/backend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only -a ims-backend-sec02
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
