global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ims-monitoring'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ims-backend'
    scheme: https
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ims-backend-sec02.fly.dev/0']
        labels:
          service: 'backend'
          environment: 'development'
