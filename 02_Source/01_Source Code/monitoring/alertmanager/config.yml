global:
  smtp_smarthost: smtp.gmail.com:587
  smtp_from: alerts@example.com
  smtp_auth_username: alerts@example.com
  smtp_auth_password: change-me-app-password
  smtp_require_tls: true

route:
  receiver: email-team
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email-team
    email_configs:
      - to: ops-team@example.com
        send_resolved: true
