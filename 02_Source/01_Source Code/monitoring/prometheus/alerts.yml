groups:
  - name: ims-api-alerts
    rules:
      - alert: BackendDown
        expr: up{job='ims-backend'} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: IMS backend is down
          description: Backend target has been unreachable for more than 2 minutes.

      - alert: HighHttpErrorRate
        expr: sum(rate(http_server_requests_total{status_class='5xx'}[5m])) / clamp_min(sum(rate(http_server_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: high
        annotations:
          summary: High 5xx rate detected
          description: HTTP 5xx error rate is above 5 percent over the last 5 minutes.

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, route, method)) > 1
        for: 10m
        labels:
          severity: medium
        annotations:
          summary: High p95 latency on backend route
          description: p95 latency is above 1 second for at least 10 minutes.
