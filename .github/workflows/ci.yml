name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (type-check + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "02_Source/01_Source Code/backend"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "02_Source/01_Source Code/backend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (Jest)
        run: npm test

  frontend:
    name: Frontend (lint + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "02_Source/01_Source Code/frontend"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "02_Source/01_Source Code/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydatabase
      BYPASS_AUTH: 'true'
      VITE_BYPASS_KEYCLOAK: 'true'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            02_Source/01_Source Code/backend/package-lock.json
            02_Source/01_Source Code/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: "02_Source/01_Source Code/backend"
        run: npm ci

      - name: Install frontend dependencies
        working-directory: "02_Source/01_Source Code/frontend"
        run: npm ci

      - name: Install Playwright browsers
        working-directory: "02_Source/01_Source Code/frontend"
        run: npx playwright install --with-deps chromium

      - name: Initialize database
        run: PGPASSWORD=mypassword psql -h localhost -U myuser -d mydatabase -f "02_Source/01_Source Code/db_schema/db-init.sql"

      - name: Run E2E tests
        working-directory: "02_Source/01_Source Code/frontend"
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: "02_Source/01_Source Code/frontend/playwright-report/"
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: "02_Source/01_Source Code/frontend/e2e/test-results/"
          retention-days: 7
